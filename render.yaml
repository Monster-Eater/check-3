databases:
  - name: campus-times-copy-db
    plan: free
    databaseName: campus_times_copy
    user: campus_times_copy

services:
  - type: keyvalue
    name: campus-times-copy-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: campus-times-copy-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT pr_campus_times.asgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-times-copy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campus-times-copy-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
