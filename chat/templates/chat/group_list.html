<!DOCTYPE html>
<html>
<head><title>Groups</title>
<style>body{font-family:Arial;padding:20px} a{display:block;padding:10px;background:#eee;margin:5px;border-radius:8px;text-decoration:none;color:black} .btn{background:#25D366;color:white;padding:10px 15px;border-radius:8px;text-decoration:none}</style>
</head>
<body>
<h2>My Groups</h2>
<a class="btn" href="{% url 'create_group' %}">+ Create New Group</a>
<a class="btn" style="background:#128C7E" href="{% url 'chat_list' %}">Back to Chats</a>
<hr>
<h3>Joined Groups:</h3>
{% for g in groups %}
<a href="{% url 'group_room' g.id %}">{{ g.name }} - {{ g.members.count }} members</a>
{% empty %}<p>No groups yet</p>{% endfor %}
<h3>All Groups - Join Any:</h3>
{% for g in all_groups %}
<a href="{% url 'group_room' g.id %}">{{ g.name }} - Click to Join</a>
{% endfor %}
</body></html>
